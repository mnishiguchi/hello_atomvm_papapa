<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Papa Singer - Audio Wiring Guide</title>
<desc id="desc">Unified circuit-level wiring diagram based on Piyopiyo PCB v1.9. XIAO ESP32-C5 PWM audio through RC filter and volume control into NJM2113D differential audio amplifier. Speaker positive terminal connects to pin 8 VOUT2 and negative terminal connects to pin 5 VOUT1. 4.7uF capacitor positive connects toward pin 2, and 10uF supply capacitor positive connects to 3V3. All red 3V3 boxes share power, all dark GND boxes share ground. The 0.1uF bypass capacitor is connected across pin 6 and pin 7.</desc>
