<svg xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans CJK JP, Noto Sans, sans-serif" font-weight="400" fill="#243447" viewBox="0 0 330 180" width="660" height="360" role="img" aria-labelledby="title desc"><title id="title">RC フィルタの働き</title><desc id="desc">高速な PWM の変化を弱め、ゆっくりした音声の変化を取り出す模式図。</desc><rect x="0" y="0" width="330.0" height="180.0" fill="#ffffff" /><g stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M10 48 H27 V16 H43 V48 H59 V16 H83 V48 H91 V16 H99 V48 H123 V16 H139 V48 H152" stroke="#0d9488" stroke-width="2.5" /><path d="M179 33 C194 30 199 22 211 23 S230 49 242 43 S262 16 277 24 S309 43 320 33" stroke="#0d9488" stroke-width="3" /><path d="M152 33 H176" stroke="#243447" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 4" /><path d="M170 29 L176 33 L170 37" stroke="#243447" stroke-opacity=".5" stroke-width="2" /></g><g fill="#243447" font-size="11" text-anchor="middle"><text x="80" y="68" font-size="9" font-weight="600">フィルタ前の PWM</text><text x="250" y="68" font-size="9" font-weight="600">平滑化した信号</text><text x="165" y="91" font-weight="700">R1 + C5</text><text x="165" y="105" font-size="10" opacity=".7">RC ローパスフィルタ</text></g><rect x="28" y="120" width="274" height="40" rx="8" fill="#0d9488" fill-opacity=".09" stroke="#0d9488" stroke-opacity=".35" /><text x="165" y="137" fill="#243447" font-size="10" text-anchor="middle" font-weight="600">音声のゆっくりした変化を残す</text><text x="165" y="151" fill="#243447" font-size="10" text-anchor="middle">PWM の高速な切り替え成分を弱める</text></svg>