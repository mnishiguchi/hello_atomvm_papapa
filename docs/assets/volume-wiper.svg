<svg xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans CJK JP, Noto Sans, sans-serif" font-weight="400" fill="#243447" viewBox="0 0 340 218" width="680" height="436" role="img" aria-labelledby="title desc"><title id="title">可変抵抗のワイパー</title><desc id="desc">抵抗の両端に信号と GND をつなぎ、途中のワイパーから信号を取り出す模式図。</desc><rect x="0" y="0" width="340.0" height="218.0" fill="#ffffff" /><rect x="28" y="34" width="284" height="130" rx="12" fill="#64748b" fill-opacity="0.07" stroke="#64748b" stroke-opacity="0.6" stroke-width="1.5" /><text x="170" y="52" fill="#243447" text-anchor="middle" font-size="14" font-weight="700">10 kΩ potentiometer</text><path d="M75 98 H265" stroke="#b58b42" stroke-width="9" stroke-linecap="round" /><circle cx="75" cy="98" r="6" fill="#0d9488" /><circle cx="265" cy="98" r="6" fill="#475569" /><path d="M190 75 V89 L181 80 M190 89 L199 80 M190 89 V98" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="190" cy="98" r="5" fill="#d97706" /><path d="M75 98 V148 M190 98 V148 M265 98 V148" fill="none" stroke-width="3" stroke-linecap="round" stroke="#0d9488" /><path d="M190 98 V148" stroke="#d97706" stroke-width="3" /><path d="M265 98 V148" stroke="#475569" stroke-width="3" /><g fill="#243447" text-anchor="middle" font-size="11"><text x="75" y="82" fill="#0d9488" font-weight="700">INPUT</text><text x="190" y="68" fill="#d97706" font-weight="700">WIPER</text><text x="265" y="82" font-weight="700">GND</text><text x="75" y="184">Filtered audio</text><text x="190" y="184">To C6 + R2</text><text x="265" y="184">Ground rail</text><text x="170" y="210" font-size="10" opacity=".7">The wiper moves along the internal resistive track.</text></g></svg>