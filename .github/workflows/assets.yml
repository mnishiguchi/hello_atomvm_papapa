name: Host checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19.6'
      - name: Test and format
        run: make check
      - name: Check generated assets
        run: |
          python3 scripts/build_assets.py
          git diff --exit-code -- components/papapa_audio/audio_catalog.generated.c components/papapa_audio/audio_catalog.generated.h lib/hello_atomvm_papapa/catalog.ex
